[project]
name = "apple-notes-brain"
version = "1.0.3"
description = "MCP server for Apple Notes on macOS — read, write, and search with full Markdown round-trip. Reads via SQLite (sub-100ms, concurrent with Notes.app), writes via AppleScript (preserves iCloud sync). Part of the -brain family."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "sweir1" },
]
maintainers = [
    { name = "sweir1" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "apple-notes",
    "applenotes",
    "notes",
    "macos",
    "claude",
    "claude-desktop",
    "claude-code",
    "applescript",
    "sqlite",
    "markdown",
    "icloud",
    "fastmcp",
    "ai-tools",
    "llm",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "markdown>=3.5",
    "markdownify>=0.11",
    "lxml>=4.9",
    "mcp>=1.0",
    "pebble>=5.0",
    "protobuf>=4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.3",
    "pytest-randomly>=3.15",
    "hypothesis>=6.95",
    "syrupy>=4.6",
]

[project.urls]
Homepage = "https://github.com/sweir1/apple-notes-brain"
Repository = "https://github.com/sweir1/apple-notes-brain"
Issues = "https://github.com/sweir1/apple-notes-brain/issues"
Changelog = "https://github.com/sweir1/apple-notes-brain/releases"
Documentation = "https://github.com/sweir1/apple-notes-brain#readme"
"Source Code" = "https://github.com/sweir1/apple-notes-brain"

[project.scripts]
apple-notes-brain = "apple_notes_brain.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_notes_brain"]

[tool.hatch.build.targets.sdist]
include = [
    "src/apple_notes_brain",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "server.json",
]
exclude = [
    "tests",
    "docs",
    ".venv",
    ".pytest_cache",
    "*.pyc",
    "__pycache__",
]

[tool.pytest.ini_options]
markers = [
    "live: opt-in tests that hit the real Notes.app + iCloud (slow; require Notes.app installed and Automation permission granted). Run with `-m live`. Skipped by default.",
    "integration: tests that exercise multiple modules together (mocked subsystems, no live system).",
    "property: hypothesis-based property tests; may take longer than unit tests.",
    "slow: tests that take >1s wall-clock and aren't part of the fast feedback loop.",
]
addopts = "-m 'not live' --cov --cov-report=term-missing --cov-report=html --cov-report=xml --strict-markers --strict-config -ra"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:google.protobuf.*",
]

[tool.coverage.run]
branch = true
source = ["src/apple_notes_brain"]
omit = [
    "src/apple_notes_brain/proto/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "def __repr__",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
