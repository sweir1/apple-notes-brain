[project]
name = "apple-notes-brain"
version = "1.1.0"
description = "MCP server for Apple Notes on macOS — read, write, and search with full Markdown round-trip. Reads via SQLite (sub-100ms, concurrent with Notes.app), writes via AppleScript (preserves iCloud sync). Part of the -brain family."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "sweir1" },
]
maintainers = [
    { name = "sweir1" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "apple-notes",
    "applenotes",
    "notes",
    "macos",
    "claude",
    "claude-desktop",
    "claude-code",
    "applescript",
    "sqlite",
    "markdown",
    "icloud",
    "fastmcp",
    "ai-tools",
    "llm",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "bleach>=6.0",
    "markdown>=3.5",
    "markdownify>=0.11",
    "lxml>=4.9",
    "mcp>=1.0",
    "pebble>=5.0",
    "protobuf>=4.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.3",
    "pytest-randomly>=3.15",
    "hypothesis>=6.95",
    "syrupy>=4.6",
]
# Semantic + hybrid search (in-process ONNX or remote Ollama). Optional —
# without this extra installed, the lexical `search_notes` tool keeps working
# and the four semantic-search tools return a structured `missing-extras`
# error rather than crashing. Install with: `pip install apple-notes-brain[semantic]`
# (or `uv sync --extra semantic` for development).
#
# Why these libs:
#  - `sqlite-vec`        — vector kNN inside the existing sqlite stack
#  - `onnxruntime`       — pure ONNX inference, no PyTorch; on macOS Apple
#                          Silicon we additionally pass CoreMLExecutionProvider
#                          for Neural Engine acceleration
#  - `tokenizers`        — Rust-backed HF tokenizer, ~10MB, no `transformers`
#                          dep needed
#  - `huggingface-hub`   — only used to download the ONNX model + tokenizer.json
#                          on first run; cache lives in <data_dir>/models
#  - `httpx`             — Ollama HTTP client (secondary embedder provider)
#  - `numpy`             — vector math (mean-pool, L2 normalise)
semantic = [
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/sweir1/apple-notes-brain"
Repository = "https://github.com/sweir1/apple-notes-brain"
Issues = "https://github.com/sweir1/apple-notes-brain/issues"
Changelog = "https://github.com/sweir1/apple-notes-brain/releases"
Documentation = "https://github.com/sweir1/apple-notes-brain#readme"
"Source Code" = "https://github.com/sweir1/apple-notes-brain"

[project.scripts]
apple-notes-brain = "apple_notes_brain.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_notes_brain"]
# Hatchling already includes package-internal data files when they live
# inside the package, but we list it here explicitly belt-and-braces:
# `data/seed-models.json` is load-bearing for the metadata resolver
# chain (Phase γ). If it's missing from the wheel, the resolver silently
# falls back to the live HF fetcher (slow + offline-broken).
include = [
    "src/apple_notes_brain/data/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/apple_notes_brain",
    "src/apple_notes_brain/data/*.json",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "server.json",
]
exclude = [
    "tests",
    "docs",
    ".venv",
    ".pytest_cache",
    "*.pyc",
    "__pycache__",
]

[tool.pytest.ini_options]
markers = [
    "live: opt-in tests that hit the real Notes.app + iCloud (slow; require Notes.app installed and Automation permission granted). Run with `-m live`. Skipped by default.",
    "integration: tests that exercise multiple modules together (mocked subsystems, no live system).",
    "property: hypothesis-based property tests; may take longer than unit tests.",
    "slow: tests that take >1s wall-clock and aren't part of the fast feedback loop.",
]
addopts = "-m 'not live' --cov --cov-report=term-missing --cov-report=html --cov-report=xml --strict-markers --strict-config -ra"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:google.protobuf.*",
]

[tool.coverage.run]
branch = true
source = ["src/apple_notes_brain"]
omit = [
    "src/apple_notes_brain/proto/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# Floor anchored at observed baseline minus ~5pp (currently 65.22% total).
# Drops below this fail the build; raise it deliberately when coverage climbs.
# To bypass for a single run: `pytest --cov-fail-under=0`.
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if __name__ == .__main__.:",
    "def __repr__",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
