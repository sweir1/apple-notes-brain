# Release workflow — publishes apple-notes-brain to PyPI on tag push.
#
# Triggered by: pushing a tag matching v* (e.g. v0.1.0).
#
# Hard guarantees enforced here:
#   1. The tagged commit MUST be reachable from main (verified via
#      git merge-base --is-ancestor). A tag pointing at any other branch
#      fails the workflow before tests, build, or publish run.
#   2. pyproject.toml version, server.json version, and the tag MUST agree.
#   3. The full unit-test suite MUST pass.
#   4. The publish step runs in GitHub Environment "pypi" — configure
#      that environment with:
#        - Required reviewers: yourself (manual approval gate)
#        - Deployment branches and tags: pattern `v*` only
#      Without those, the publish auto-runs after build. With them, you
#      get an explicit "approve deployment" click in the GitHub UI before
#      anything reaches PyPI.
#
# On PyPI side, configure a Trusted Publisher pointing at:
#   - Owner: sweir1
#   - Repository: apple-notes-brain
#   - Workflow filename: release.yml
#   - Environment name: pypi
# Once configured, this workflow publishes via OIDC — no API tokens needed.

name: Release to PyPI

on:
  push:
    tags:
      - 'v*'

# Default-deny all permissions at workflow level; each job opts in to what it
# actually needs. This is the principle-of-least-privilege baseline.
permissions: {}

# Don't cancel an in-flight release if a second tag is pushed; let the first
# finish (or fail) before the second starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------
  # Job 1 — Hard gate: tag must be on main + versions must agree.
  # If this job fails, nothing downstream runs.
  # ----------------------------------------------------------------------
  verify:
    name: Verify tag + versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out at tagged commit (full history)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0  # need full history for merge-base check

      - name: Refuse if tagged commit is not on main
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error title=Tag not on main::Tag ${{ github.ref_name }} points at commit ${{ github.sha }} which is NOT reachable from origin/main. Refusing to release."
            exit 1
          fi
          echo "✓ Tag ${{ github.ref_name }} (${{ github.sha }}) is reachable from main"

      - name: Verify pyproject.toml version matches tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pyproject_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "::error title=Version mismatch::Tag is v${tag_version} but pyproject.toml has version=${pyproject_version}"
            exit 1
          fi
          echo "✓ Tag and pyproject.toml versions match: ${tag_version}"

      - name: Verify server.json versions match tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          server_top=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          server_pkg=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          if [ "$tag_version" != "$server_top" ] || [ "$tag_version" != "$server_pkg" ]; then
            echo "::error title=server.json version mismatch::tag=v${tag_version}, server.json top=${server_top}, packages[0]=${server_pkg}"
            exit 1
          fi
          echo "✓ server.json versions match: ${tag_version}"
          echo "::warning title=server.json env vars::Reminder: server.json environmentVariables are NOT auto-synced. If you added new env vars in code since the last release, hand-edit server.json before tagging."

  # ----------------------------------------------------------------------
  # Job 2 — Run the unit test suite.
  # Live tests (-m live) are excluded by pyproject default; CI runs only
  # the mocked unit tests. Live tests need real Notes.app + iCloud and
  # cannot run on a Linux runner.
  # ----------------------------------------------------------------------
  test:
    name: Tests
    needs: verify
    # Run on macOS to match the production target — Apple Notes only exists
    # on macOS, and some imports indirectly assume macOS pathing/binaries.
    # Ubuntu runners would catch a subset but introduce a separate "does it
    # work on Linux" question that's irrelevant for this server.
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      # Force uv-managed Python at the JOB level — every step in this job
      # sees this var. The macos-latest system Python is built without
      # --enable-loadable-sqlite-extensions which sqlite_vec.load() needs.
      UV_PYTHON_PREFERENCE: only-managed
      # Pin huggingface_hub model cache to a known workspace path so the
      # restore step below targets the same dir the prefetch step writes
      # to and the ONNX embedder reads from. No save step in release.yml —
      # saves live in ci.yml on main pushes only, and tag-pushed release
      # runs read main's cache via cross-ref fallthrough (GitHub Actions
      # caches saved on the default branch are visible to all other refs,
      # including tags). Mirrors obsidian-brain release.yml's restore-only
      # pattern.
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up uv + Python (managed)
        # SHA-pinned per setup-uv's own docs (immutable, supply-chain safe).
        # Comment denotes the human-readable version; bump both together.
        # UV_PYTHON_PREFERENCE=only-managed is set at the job level above
        # so it applies to every step including the actual `uv run pytest`.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Restore HuggingFace model cache
        # Restore-only (no save) — saves live in ci.yml's validate job on
        # main pushes. GitHub Actions caches are scoped per-ref: tag-pushed
        # workflows can't share caches with each other but CAN read from
        # the default-branch (main) scope via cross-ref fallthrough. The
        # restore-keys ladder is intentionally redundant with ci.yml's
        # so a release that runs before main has populated v1 still picks
        # up an older partial-key match.
        uses: actions/cache/restore@v5
        continue-on-error: true
        id: hf-cache-restore
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: hf-models-bge-small-en-v1.5-v1
          restore-keys: |
            hf-models-bge-small-en-v1.5-
            hf-models-

      - name: Restore MTEB venv (for seed regeneration)
        # Restore-only — saves live in ci.yml's warm-mteb-venv job on
        # main pushes. Same cross-ref fallthrough principle as the HF
        # model cache above; release runs read main's cache.
        #
        # Patch-version pinned because torch/scipy ABI breaks on Python
        # patch drift. No restore-keys fallback for the same reason.
        uses: actions/cache/restore@v5
        continue-on-error: true
        id: mteb-venv-restore
        with:
          path: ~/.venv-mteb
          key: mteb-venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.setup-python.outputs.python-version || '3.11' }}-${{ hashFiles('scripts/requirements-build-seed.txt') }}-v1

      - name: Regenerate seed-models.json from MTEB (cache hit only)
        # If the MTEB venv is warm, regenerate the bundled seed JSON so
        # the release tarball ships the freshest model metadata that
        # MTEB upstream knows about. Zero HF API calls — MTEB packs its
        # own curated prompts + max_tokens for every model.
        #
        # `continue-on-error: true` means a failed regen (mteb upgrade
        # broke our extractor; flake) does NOT block the release. The
        # committed anchor at src/apple_notes_brain/data/seed-models.json
        # still ships in the wheel.
        if: steps.mteb-venv-restore.outputs.cache-hit == 'true'
        run: ~/.venv-mteb/bin/python scripts/build-seed.py
        continue-on-error: true

      - name: Validate regenerated seed parses
        if: steps.mteb-venv-restore.outputs.cache-hit == 'true'
        run: |
          python3 -c "import json; d = json.load(open('src/apple_notes_brain/data/seed-models.json')); assert len(d['models']) > 0, 'empty seed'; print(f'seed: {len(d[\"models\"])} models')"

      - name: Install dependencies
        # Both extras so the semantic test suite collects + runs.
        run: uv sync --extra dev --extra semantic

      - name: Prefetch ONNX model (so the slow integration test is fast)
        # Same model + filenames as ci.yml's prefetch. Cheap on a cache
        # hit (huggingface_hub validates etag and reuses the local file);
        # on a cold release runner (no cache hit at all, e.g. very first
        # release after the cache scheme changed) this is the rate-limited
        # download that the cache exists to amortise. continue-on-error
        # left false: a release should fail visibly rather than ship a
        # build whose integration test couldn't even fetch the model.
        id: prefetch
        run: |
          uv run python -c "
          from huggingface_hub import hf_hub_download
          import os
          cache = os.environ['HF_HOME']
          for fname in ['onnx/model_quantized.onnx', 'tokenizer.json']:
              hf_hub_download(repo_id='Xenova/bge-small-en-v1.5', filename=fname, cache_dir=cache)
          print('prefetch ok')
          "
        continue-on-error: false

      - name: Run pytest
        run: uv run pytest -q

  # ----------------------------------------------------------------------
  # Job 3 — Build wheel + sdist with uv.
  # ----------------------------------------------------------------------
  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up uv
        # Pin to specific version: setup-uv ships immutable per-version tags
        # (no rolling major-version tag). Bump manually for new versions.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Sanity-check dist/ contents
        run: |
          set -euo pipefail
          ls -la dist/
          wheel_count=$(ls dist/*.whl 2>/dev/null | wc -l | tr -d ' ')
          sdist_count=$(ls dist/*.tar.gz 2>/dev/null | wc -l | tr -d ' ')
          if [ "$wheel_count" != "1" ] || [ "$sdist_count" != "1" ]; then
            echo "::error title=Bad dist::expected exactly 1 wheel + 1 sdist, got ${wheel_count} wheels + ${sdist_count} sdists"
            exit 1
          fi
          echo "✓ Built ${wheel_count} wheel + ${sdist_count} sdist"

      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------------------------
  # Job 4 — Publish to PyPI via OIDC trusted publishing.
  # NO API tokens. Authentication via GitHub OIDC; PyPI verifies the
  # workflow filename + environment name match the registered Trusted
  # Publisher (configured at pypi.org/manage/account/publishing).
  #
  # The `environment: pypi` block makes GitHub require approval from the
  # configured reviewers BEFORE this job's steps run — that's your
  # explicit per-release sign-off gate.
  # ----------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/apple-notes-brain
    permissions:
      id-token: write   # mandatory for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with:` block needed — defaults to:
        #   - Reading dist/*.whl + dist/*.tar.gz
        #   - Authenticating via OIDC (because id-token: write is set)
        #   - Generating PEP 740 attestations automatically
